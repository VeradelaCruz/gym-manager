server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true

      routes:

        - id: class-service
          uri: lb://class-service
          predicates:
            - Path=/api/classes/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/